<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#164b43">
  <title>Handover Helper Dubai</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="header wrap">
    <a class="brand" href="#"><span class="brand-icon" aria-hidden="true">H.</span><span data-i18n="brand"></span></a>
    <div class="language" role="group" data-aria="language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="ru">RU</button></div>
  </header>
  <main>
    <section class="hero wrap">
      <div class="hero-copy"><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="hero"></h1><p class="intro" data-i18n="intro"></p><div class="actions"><a class="button primary" href="#checklist" data-i18n="start"></a><a class="button secondary" id="hero-whatsapp" target="_blank" rel="noopener noreferrer" data-i18n="talk"></a></div><p class="byline" data-i18n="byline"></p></div>
      <div class="hero-art" aria-hidden="true"><div class="sun"></div><div class="building b1"></div><div class="building b2"></div><div class="building b3"></div><div class="arch"><div class="door-knob"></div></div><div class="art-caption"><span>01 — 10</span><span data-i18n="artCaption"></span></div></div>
    </section>
    <section class="wrap section" id="checklist">
      <div class="section-heading"><div><p class="eyebrow" data-i18n="checkEyebrow"></p><h2 data-i18n="checkTitle"></h2></div><p data-i18n="checkIntro"></p></div>
      <div class="progress-panel"><div class="progress-label"><strong id="progress-text" aria-live="polite"></strong><span data-i18n="saved"></span></div><div class="progress-track" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" data-aria="progressLabel"><div id="progress-fill"></div></div></div>
      <div class="checklist" id="steps"></div>
    </section>
    <section class="wrap section tools-grid">
      <div class="panel estimator"><p class="eyebrow" data-i18n="estimateEyebrow"></p><h2 data-i18n="estimateTitle"></h2><p class="note" data-i18n="estimateWarning"></p>
        <div class="input-grid"><div><label for="size" data-i18n="size"></label><input id="size" type="number" min="1" max="100000" step="any" value="800" inputmode="decimal" aria-describedby="estimate-error"></div><div><label for="level" data-i18n="level"></label><select id="level"></select></div></div>
        <p class="error" id="estimate-error" aria-live="polite"></p><dl id="estimate-results" class="results" aria-live="polite"></dl><p class="small" data-i18n="estimateBasis"></p>
      </div>
      <aside class="panel calculator"><div class="calc-icon" aria-hidden="true">↗</div><p class="eyebrow" data-i18n="calculatorEyebrow"></p><h2 data-i18n="calculatorTitle"></h2><p data-i18n="calculatorIntro"></p><a class="button secondary" href="https://evgheni34-hash.github.io/offplan-assignment-ledger" target="_blank" rel="noopener noreferrer" data-i18n="calculatorLink"></a></aside>
    </section>
    <section class="wrap section" id="contact"><div class="contact-grid"><div><p class="eyebrow" data-i18n="contactEyebrow"></p><h2 data-i18n="contactTitle"></h2><p data-i18n="contactIntro"></p><div class="broker"><div class="avatar" aria-hidden="true">EC</div><div><strong data-i18n="brokerName"></strong><span data-i18n="brokerRole"></span></div></div><a class="text-link" href="https://wa.me/971585668337" target="_blank" rel="noopener noreferrer">+971 58 566 8337 ↗</a><a class="text-link" href="https://www.instagram.com/Eugene.therealtor/" target="_blank" rel="noopener noreferrer">@Eugene.therealtor ↗</a></div>
      <form id="lead-form" class="panel" novalidate><div class="input-grid"><div><label for="name" data-i18n="name"></label><input id="name" name="name" autocomplete="name" maxlength="100" required></div><div><label for="project" data-i18n="project"></label><input id="project" name="project" maxlength="150" required></div></div><label for="month" data-i18n="month"></label><input id="month" name="month" type="month" required><fieldset><legend data-i18n="services"></legend><div id="service-options" class="service-options"></div></fieldset><p class="error" id="form-error" role="alert"></p><button class="button primary" type="submit" data-i18n="send"></button><p class="small" data-i18n="privacy"></p></form></div></section>
  </main>
  <footer class="wrap footer"><strong data-i18n="brand"></strong><p data-i18n="disclaimer"></p><p class="small" data-i18n="footerNote"></p></footer>
</body>
</html>
